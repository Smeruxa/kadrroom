apiVersion: apps/v1
kind: Deployment
metadata:
    name: web
spec:
    replicas: 1
    selector:
        matchLabels:
            app: web
    template:
        metadata:
            labels:
                app: web
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
            containers:
                - name: web
                  image: kadrroom/web:ci
                  imagePullPolicy: Never
                  ports:
                      - name: http
                        containerPort: 8080
                  readinessProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
    name: web
spec:
    selector:
        app: web
    ports:
        - name: http
          port: 8080
          targetPort: http
