worker_processes 1;
worker_shutdown_timeout 10s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format kadrroom '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout kadrroom;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /tmp/kadrroom-proxy-context.conf;

    map $uri $api_upstream {
        ~^/v1/auth/ "${IDENTITY_API_UPSTREAM}";
        ~^/v1/(?:rooms(?:/|$)|join$) "${ROOMS_API_UPSTREAM}";
        default "${CATALOG_API_UPSTREAM}";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /v1/admin {
            return 404;
        }

        location ^~ /v1/admin/ {
            return 404;
        }

        location ^~ /v1/ {
            include /tmp/kadrroom-api.conf;
            proxy_send_timeout 10s;
            proxy_read_timeout 75s;

            location ^~ /v1/media/ {
                include /tmp/kadrroom-api.conf;
                error_log /dev/null crit;
                proxy_buffering off;
            }

            location ~ ^/v1/rooms/[^/]+/ws$ {
                include /tmp/kadrroom-api.conf;
                error_log /dev/null crit;
            }
        }

        location ~ ^/(?:join|verify|reset)/?$ {
            error_log /dev/null crit;
            add_header Cache-Control no-store always;
            add_header Referrer-Policy no-referrer always;
            try_files /index.html =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location ~* \.(?:js|css)$ {
            try_files $uri =404;
        }

        location ~ ^/(?:media|demo-media)/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
