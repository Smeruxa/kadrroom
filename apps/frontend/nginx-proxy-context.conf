set_real_ip_from ${KADRROOM_TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $identity_proxy_token {
    ~^/v1/auth/ "${KADRROOM_AUTH_PROXY_TOKEN}";
    default "";
}

map $identity_proxy_token $identity_client_ip {
    "" "";
    default $remote_addr;
}
