apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend
spec:
    replicas: 1
    minReadySeconds: 2
    progressDeadlineSeconds: 90
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                runAsUser: 101
                runAsGroup: 101
                fsGroup: 101
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: frontend
                  image: kadrroom/frontend:ci
                  imagePullPolicy: Never
                  ports:
                      - name: http
                        containerPort: 8080
                  env:
                      - name: POD_NAMESPACE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                      - name: CATALOG_API_UPSTREAM
                        value: catalog-api.$(POD_NAMESPACE).svc.cluster.local:8080
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: [ALL]
                  resources:
                      requests:
                          cpu: 25m
                          memory: 16Mi
                      limits:
                          memory: 64Mi
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                  readinessProbe:
                      httpGet:
                          path: /
                          port: http
                      periodSeconds: 2
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      periodSeconds: 10
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
    name: frontend
spec:
    selector:
        app: frontend
    ports:
        - name: http
          port: 8080
          targetPort: http
