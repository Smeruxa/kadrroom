<header class="topbar">
    <div class="topbar-inner">
        <a class="wordmark" routerLink="/"><span class="mark" aria-hidden="true"></span>KadrRoom</a>
        <nav aria-label="Основная навигация">
            <a
                class="catalog-link"
                routerLink="/"
                routerLinkActive
                [routerLinkActiveOptions]="navActiveOptions"
                ariaCurrentWhenActive="page"
                >Каталог</a
            >
            <a
                class="join-link"
                routerLink="/join"
                routerLinkActive
                [routerLinkActiveOptions]="navActiveOptions"
                ariaCurrentWhenActive="page"
                >Присоединиться</a
            >
            @if (account()) {
                <a
                    class="account-link"
                    routerLink="/account"
                    routerLinkActive
                    [routerLinkActiveOptions]="navActiveOptions"
                    ariaCurrentWhenActive="page"
                    >Аккаунт</a
                >
            } @else {
                <a
                    class="account-link"
                    routerLink="/login"
                    routerLinkActive
                    [routerLinkActiveOptions]="navActiveOptions"
                    ariaCurrentWhenActive="page"
                    >Войти</a
                >
            }
        </nav>
    </div>
</header>
<main class="layout">
    <router-outlet />
</main>
