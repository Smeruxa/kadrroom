worker_processes 1;
worker_shutdown_timeout 10s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format kadrroom '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout kadrroom;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    include /tmp/kadrroom-proxy-context.conf;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $api_upstream {
        ~^/v1/auth/(?:session|login|logout)$ "${IDENTITY_API_UPSTREAM}";
        ~^/v1/admin/ "${ADMIN_API_UPSTREAM}";
        ~^/v1/covers/ "${CATALOG_API_UPSTREAM}";
        default "";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /v1/ {
            if ($api_upstream = "") {
                return 404;
            }

            client_max_body_size 136m;
            client_body_timeout 45s;
            include /tmp/kadrroom-api.conf;
            proxy_request_buffering off;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        location = /index.html {
            expires -1;
        }

        location ~* \.(?:js|css)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
