apiVersion: apps/v1
kind: Deployment
metadata:
    name: catalog-api
spec:
    replicas: 1
    minReadySeconds: 2
    progressDeadlineSeconds: 90
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    selector:
        matchLabels:
            app: catalog-api
    template:
        metadata:
            labels:
                app: catalog-api
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: catalog-api
                  image: kadrroom/catalog-api:ci
                  imagePullPolicy: Never
                  ports:
                      - name: http
                        containerPort: 8080
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: [ALL]
                  resources:
                      requests:
                          cpu: 25m
                          memory: 16Mi
                      limits:
                          memory: 64Mi
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: http
                      periodSeconds: 2
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
    name: catalog-api
spec:
    selector:
        app: catalog-api
    ports:
        - name: http
          port: 8080
          targetPort: http
