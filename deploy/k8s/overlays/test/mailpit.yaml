apiVersion: apps/v1
kind: Deployment
metadata:
    name: mailpit
spec:
    replicas: 1
    selector:
        matchLabels:
            app: mailpit
    template:
        metadata:
            labels:
                app: mailpit
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: mailpit
                  image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
                  ports:
                      - name: smtp
                        containerPort: 1025
                      - name: http
                        containerPort: 8025
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: [ALL]
                  resources:
                      requests:
                          cpu: 25m
                          memory: 32Mi
                      limits:
                          memory: 128Mi
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                  readinessProbe:
                      tcpSocket:
                          port: smtp
                      periodSeconds: 3
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
    name: mailpit
spec:
    selector:
        app: mailpit
    ports:
        - name: smtp
          port: 1025
          targetPort: smtp
        - name: http
          port: 8025
          targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: mailpit-ingress
spec:
    podSelector:
        matchLabels:
            app: mailpit
    policyTypes: [Ingress]
    ingress:
        - from:
              - podSelector:
                    matchLabels:
                        app: identity-api
          ports:
              - port: 1025
