apiVersion: v1
kind: ServiceAccount
metadata:
    name: kadrroom-runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: kadrroom-deployer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: kadrroom-deployer
rules:
    - apiGroups: [apps]
      resources: [deployments]
      resourceNames:
          [frontend, catalog-api, identity-api, rooms-api, admin-frontend, admin-api, media-worker]
      verbs: [get, list, patch, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: kadrroom-deployer
subjects:
    - kind: ServiceAccount
      name: kadrroom-deployer
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: kadrroom-deployer
