apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: deny-ingress
spec:
    podSelector: {}
    policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: frontend-ingress
spec:
    podSelector:
        matchExpressions:
            - key: app
              operator: In
              values: [frontend, admin-frontend]
    policyTypes: [Ingress]
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
                podSelector:
                    matchLabels:
                        app.kubernetes.io/name: traefik
          ports:
              - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: catalog-ingress
spec:
    podSelector:
        matchLabels:
            app: catalog-api
    policyTypes: [Ingress]
    ingress:
        - from:
              - podSelector:
                    matchExpressions:
                        - key: app
                          operator: In
                          values: [frontend, admin-frontend, rooms-api]
          ports:
              - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: identity-ingress
spec:
    podSelector:
        matchLabels:
            app: identity-api
    policyTypes: [Ingress]
    ingress:
        - from:
              - podSelector:
                    matchExpressions:
                        - key: app
                          operator: In
                          values: [frontend, admin-frontend, admin-api, rooms-api]
          ports:
              - port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: rooms-ingress
spec:
    podSelector:
        matchLabels:
            app: rooms-api
    policyTypes: [Ingress]
    ingress:
        - from:
              - podSelector:
                    matchLabels:
                        app: frontend
          ports:
              - port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: admin-api-ingress
spec:
    podSelector:
        matchLabels:
            app: admin-api
    policyTypes: [Ingress]
    ingress:
        - from:
              - podSelector:
                    matchLabels:
                        app: admin-frontend
          ports:
              - port: 8083
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: admin-api-egress
spec:
    podSelector:
        matchLabels:
            app: admin-api
    policyTypes: [Egress]
    egress:
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
                podSelector:
                    matchLabels:
                        k8s-app: kube-dns
          ports:
              - port: 53
                protocol: TCP
              - port: 53
                protocol: UDP
        - to:
              - podSelector:
                    matchLabels:
                        app: identity-api
          ports:
              - port: 8081
        - to:
              - podSelector:
                    matchLabels:
                        app: postgres
          ports:
              - port: 5432
