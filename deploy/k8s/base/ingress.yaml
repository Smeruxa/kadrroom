apiVersion: v1
kind: ConfigMap
metadata:
    name: public-origin
data:
    url: https://kadrroom.example.invalid
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: admin-origin
data:
    url: https://admin.kadrroom.example.invalid
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: frontend
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
    ingressClassName: traefik
    tls:
        - hosts:
              - kadrroom.example.invalid
          secretName: frontend-tls
    rules:
        - host: kadrroom.example.invalid
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: frontend
                            port:
                                name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: admin-frontend
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
    ingressClassName: traefik
    tls:
        - hosts:
              - admin.kadrroom.example.invalid
          secretName: admin-frontend-tls
    rules:
        - host: admin.kadrroom.example.invalid
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: admin-frontend
                            port:
                                name: http
