apiVersion: v1
kind: Service
metadata:
    name: postgres
spec:
    selector:
        app: postgres
    ports:
        - name: postgres
          port: 5432
          targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
    name: postgres-headless
spec:
    clusterIP: None
    selector:
        app: postgres
    ports:
        - name: postgres
          port: 5432
          targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres
spec:
    serviceName: postgres-headless
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                runAsUser: 70
                runAsGroup: 70
                fsGroup: 70
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: postgres
                  image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
                  ports:
                      - name: postgres
                        containerPort: 5432
                  env:
                      - name: POSTGRES_USER
                        value: kadrroom
                      - name: POSTGRES_DB
                        value: postgres
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                      - name: POSTGRES_INITDB_ARGS
                        value: --auth-host=scram-sha-256
                  envFrom:
                      - secretRef:
                            name: postgres-bootstrap
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: [ALL]
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          memory: 1Gi
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
                      - name: init
                        mountPath: /docker-entrypoint-initdb.d
                        readOnly: true
                      - name: socket
                        mountPath: /var/run/postgresql
                      - name: tmp
                        mountPath: /tmp
                  startupProbe:
                      exec:
                          command: [pg_isready, -h, '127.0.0.1', -U, kadrroom, -d, postgres]
                      periodSeconds: 3
                      failureThreshold: 60
                  readinessProbe:
                      exec:
                          command:
                              - sh
                              - -ec
                              - >-
                                  count=$(psql --no-psqlrc --set=ON_ERROR_STOP=1 -U "$POSTGRES_USER"
                                  -d postgres -At -c "SELECT count(*) FROM pg_database
                                  WHERE datname IN ('catalog', 'identity', 'rooms')");
                                  test "$count" -eq 3
                      periodSeconds: 3
                  livenessProbe:
                      exec:
                          command: [pg_isready, -h, '127.0.0.1', -U, kadrroom, -d, postgres]
                      periodSeconds: 10
            volumes:
                - name: init
                  configMap:
                      name: postgres-init
                - name: socket
                  emptyDir: {}
                - name: tmp
                  emptyDir:
                      sizeLimit: 64Mi
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes: [ReadWriteOnce]
              storageClassName: local-path
              resources:
                  requests:
                      storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: postgres-ingress
spec:
    podSelector:
        matchLabels:
            app: postgres
    policyTypes: [Ingress]
    ingress:
        - from:
              - podSelector:
                    matchExpressions:
                        - key: app
                          operator: In
                          values: [catalog-api, identity-api, rooms-api, admin-api, media-worker]
          ports:
              - port: 5432
