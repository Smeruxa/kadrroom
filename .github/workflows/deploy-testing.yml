name: Deploy in testing

on:
    workflow_call:
        inputs:
            app:
                type: string
                required: true

permissions:
    contents: read

jobs:
    deploy-and-smoke-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            APP: ${{ inputs.app }}
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v7
              with:
                  name: image-catalog-api
                  path: ${{ runner.temp }}/kadrroom-images/image-catalog-api
            - uses: actions/download-artifact@v7
              if: inputs.app == 'frontend'
              with:
                  name: image-frontend
                  path: ${{ runner.temp }}/kadrroom-images/image-frontend
            - uses: helm/kind-action@v1.14.0
              with:
                  cluster_name: testing
                  wait: 120s
            - name: Deploy and verify the application
              run: |
                  bash tools/ci/test-deploy.sh "$APP" testing \
                      "$RUNNER_TEMP/kadrroom-images" "$RUNNER_TEMP/kadrroom-testing"
            - name: Collect kind diagnostics
              if: failure()
              run: kind export logs "$RUNNER_TEMP/kadrroom-testing/kind" --name testing || true
            - uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: testing-${{ inputs.app }}-diagnostics
                  path: ${{ runner.temp }}/kadrroom-testing/
                  if-no-files-found: ignore
                  overwrite: true
                  retention-days: 7
