name: Deploy the full stack in testing

on:
    workflow_call:

permissions:
    contents: read

jobs:
    deploy-and-smoke-test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v7
              with:
                  pattern: image-*
                  path: ${{ runner.temp }}/kadrroom-images
            - uses: helm/kind-action@v1.14.0
              with:
                  cluster_name: stack-testing
                  wait: 120s
            - name: Deploy and verify the seven images
              run: |
                  bash tools/ci/deploy-stack-testing.sh stack-testing "$RUNNER_TEMP/kadrroom-images" \
                      "$RUNNER_TEMP/kadrroom-stack" -- bash tools/ci/smoke-testing-stack.sh
            - name: Collect kind diagnostics
              if: failure()
              run: kind export logs "$RUNNER_TEMP/kadrroom-stack/kind" --name stack-testing || true
            - uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: testing-stack-diagnostics
                  path: ${{ runner.temp }}/kadrroom-stack/
                  if-no-files-found: ignore
                  overwrite: true
                  retention-days: 7
