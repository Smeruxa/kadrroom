name: Catalog API

on:
    pull_request:
        paths: &catalog-paths
            - 'apps/catalog-api/**'
            - 'internal/catalogmedia/**'
            - 'tools/ci/check-go-format.sh'
            - 'tools/ci/test-deploy.sh'
            - 'go.mod'
            - 'go.sum'
            - '.golangci.yml'
            - '.dockerignore'
            - '.github/workflows/catalog-api.yml'
            - '.github/workflows/go-postgres.yml'
            - '.github/workflows/container-image.yml'
            - '.github/workflows/deploy-testing.yml'
    push:
        branches: [main]
        paths: *catalog-paths
    workflow_dispatch:
    workflow_call:
        inputs:
            checks-only:
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: catalog-api-${{ inputs.checks-only && 'checks' || 'app' }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        uses: ./.github/workflows/go-postgres.yml
        with:
            app: catalog-api
            database: catalog_test
            database-url-variable: KADRROOM_CATALOG_TEST_DATABASE_URL
            shared-package: internal/catalogmedia
    build-image:
        if: ${{ !inputs.checks-only }}
        uses: ./.github/workflows/container-image.yml
        with:
            app: catalog-api
    deploy-in-testing:
        needs: [check, build-image]
        uses: ./.github/workflows/deploy-testing.yml
        with:
            app: catalog-api
